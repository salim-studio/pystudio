<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PyStudio logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="56" y="56" width="400" height="400" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="56" y="56" width="400" height="400" rx="112" fill="url(#shine)"/>
  <!-- Terminal / notebook mark -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 200 L228 256 L168 312" stroke-width="34" opacity="0.95"/>
    <line x1="262" y1="318" x2="348" y2="318" stroke-width="34"/>
  </g>
  <!-- Python dots -->
  <circle cx="348" cy="196" r="22" fill="#ffffff"/>
  <circle cx="348" cy="196" r="22" fill="#000" opacity="0.08"/>
  <!-- Wordmark base -->
  <text x="256" y="452" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1" fill="#09090b">PyStudio</text>
</svg>
